<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>トレンド観測所 — Preact試作</title>
<meta name="description" content="トレンド収集の公開サイトを Preact で作り直す試作版。カレンダー付きトップと日次ページを含む。本番サイトとは別に検証するためのプロトタイプです。">
<style>
  :root{
    --bg:#f4f6fb; --bg2:#e9edf7; --card:#ffffff; --ink:#131722; --ink2:#5b6474;
    --line:#e2e7f0; --accent:#2563eb; --accent2:#7c3aed;
    --chip:#eef2fb; --shadow:0 6px 24px rgba(30,45,90,.08);
    --radius:16px;
  }
  [data-theme="dark"]{
    --bg:#0c0f16; --bg2:#11151f; --card:#161b28; --ink:#e8ecf4; --ink2:#97a1b5;
    --line:#242c3f; --chip:#1d2537; --shadow:0 6px 24px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; color:var(--ink);
    background:linear-gradient(180deg,var(--bg2),var(--bg) 260px);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    line-height:1.55;
  }
  a{color:var(--accent)}
  .wrap{max-width:880px;margin:0 auto;padding:0 14px calc(28px + env(safe-area-inset-bottom))}
  header{
    position:sticky;top:0;z-index:20;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    background:color-mix(in srgb, var(--bg) 78%, transparent);
    border-bottom:1px solid var(--line);
  }
  .hbar{max-width:880px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
  .logo{font-weight:800;font-size:19px;letter-spacing:.02em}
  .logo a{color:inherit;text-decoration:none}
  .logo .dot{color:var(--accent)}
  .badge{font-size:11px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--accent),var(--accent2));
    padding:3px 9px;border-radius:999px;letter-spacing:.08em}
  .spacer{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);
    width:40px;height:40px;border-radius:12px;font-size:17px;cursor:pointer}
  .hero{padding:20px 2px 6px}
  .hero h1{font-size:26px;margin:0 0 4px;line-height:1.3}
  .hero p{margin:0;color:var(--ink2);font-size:14px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 6px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 12px 10px;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.15}
  .stat span{font-size:11.5px;color:var(--ink2)}
  nav.tabs{position:sticky;top:61px;z-index:15;display:flex;gap:8px;padding:10px 0 8px;
    background:linear-gradient(180deg,var(--bg) 75%,transparent);overflow-x:auto;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink2);
    border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px}
  .tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  section.panel{animation:fade .18s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px;margin:10px 0}
  .card h2{font-size:16px;margin:0 0 8px}
  .sect{font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:.06em;margin:18px 0 2px}
  .sumitem{padding:10px 0;border-top:1px dashed var(--line)}
  .sumitem:first-of-type{border-top:none}
  .sumitem .t{font-weight:700}
  .sumitem .d{font-size:13.5px;color:var(--ink2);margin-top:2px}
  .catchip{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:6px;
    padding:1px 7px;margin-left:8px;vertical-align:2px;white-space:nowrap}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 4px}
  .search{flex:1 1 180px;display:flex;align-items:center;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:44px}
  .search input{border:none;outline:none;background:none;color:var(--ink);font-size:15px;width:100%}
  select{border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:12px;min-height:44px;padding:0 10px;font-size:14px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .fchip{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;
    padding:6px 12px;font-size:13px;cursor:pointer;min-height:36px}
  .fchip.on{color:#fff;border-color:transparent;font-weight:700}
  .topic{display:flex;gap:12px;align-items:flex-start}
  .topic .main{flex:1;min-width:0}
  .topic .title{font-weight:700;font-size:15.5px;overflow-wrap:anywhere}
  .topic .title a{color:inherit;text-decoration:none}
  .topic .title a:hover{text-decoration:underline}
  .meta{font-size:12.5px;color:var(--ink2);margin-top:3px;font-variant-numeric:tabular-nums}
  .nums{text-align:right;flex:0 0 auto}
  .nums b{font-size:20px;font-variant-numeric:tabular-nums}
  .nums span{display:block;font-size:11px;color:var(--ink2)}
  .newb{font-size:10.5px;font-weight:800;color:#fff;background:#e11d48;border-radius:5px;
    padding:1px 6px;margin-right:6px;vertical-align:2px}
  .srcs{margin-top:5px;display:flex;gap:4px;flex-wrap:wrap}
  .src{font-size:11px;background:var(--chip);border-radius:6px;padding:1px 7px;color:var(--ink2)}
  .seg{display:inline-flex;background:var(--chip);border-radius:12px;padding:3px;gap:2px}
  .seg button{border:none;background:none;color:var(--ink2);padding:8px 14px;border-radius:9px;
    font-size:13.5px;font-weight:600;cursor:pointer;min-height:38px}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .bar-row{display:grid;grid-template-columns:86px 1fr 74px;gap:10px;align-items:center;margin:9px 0}
  .bar-row .nm{font-size:13.5px;font-weight:600}
  .bar-track{height:14px;background:var(--chip);border-radius:7px;overflow:hidden}
  .bar-fill{height:100%;border-radius:7px;transition:width .3s ease}
  .bar-row .vl{font-size:12.5px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.heat{border-collapse:separate;border-spacing:3px;font-size:12px;min-width:560px;width:100%}
  table.heat th{font-weight:600;color:var(--ink2);padding:4px 2px;white-space:nowrap}
  table.heat td{border-radius:8px;text-align:center;padding:7px 2px;font-variant-numeric:tabular-nums;
    color:#fff;min-width:52px}
  table.heat td.dim{color:var(--ink2)}
  .cloud{text-align:center;padding:10px 4px;line-height:1.25}
  .cloud span{display:inline-block;margin:3px 5px;cursor:default;font-weight:600}
  .cloud span.clk{cursor:pointer;border-radius:8px;padding:0 3px}
  .cloud span.clk:hover{background:var(--chip)}
  .cloud span.sel{background:var(--chip);box-shadow:0 0 0 2px var(--accent) inset}
  .wpanel{margin-top:6px;border-top:1px dashed var(--line);padding-top:10px;text-align:left}
  .wpanel .wh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .wpanel .wh b{font-size:17px}
  .wpanel .wx{margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--ink2);
    border-radius:9px;width:34px;height:34px;font-size:14px;cursor:pointer;flex:0 0 auto}
  .witem{padding:8px 0;border-top:1px dashed var(--line)}
  .witem .title{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
  .witem .title a{color:inherit;text-decoration:none}
  .witem .title a:hover{text-decoration:underline}
  footer{margin-top:26px;font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line);padding-top:14px}
  .empty{color:var(--ink2);text-align:center;padding:26px 0}
  .btn{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:700;
    border-radius:12px;padding:11px 18px;font-size:14.5px;min-height:44px}
  /* calendar */
  .cal-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .cal-head b{font-size:16px}
  .cal-head .iconbtn{width:36px;height:36px;border-radius:10px;font-size:15px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .cal .wd{text-align:center;font-size:11.5px;color:var(--ink2);font-weight:700;padding:2px 0}
  .cal .wd:first-child{color:#e11d48}
  .cell{min-height:66px;border:1px solid var(--line);border-radius:10px;padding:5px 6px;
    background:var(--card);position:relative}
  .cell.blank{background:none;border-style:dashed;opacity:.35}
  .cell .dnum{font-weight:700;font-size:14px}
  .cell.nodata .dnum{color:var(--ink2);font-weight:500}
  .cell.today{outline:2px solid var(--accent);outline-offset:-2px}
  a.cell{display:block;text-decoration:none;color:inherit}
  a.cell:hover{border-color:var(--accent)}
  .cbadge{display:block;font-size:10px;line-height:1.35;color:var(--ink2);margin-top:2px}
  .cbadge b{color:var(--accent);font-variant-numeric:tabular-nums}
  /* accordion */
  .acc{border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden;background:var(--card)}
  .acc-h{width:100%;display:flex;align-items:center;gap:8px;background:none;border:none;color:var(--ink);
    padding:12px 14px;font-size:14.5px;font-weight:700;cursor:pointer;min-height:48px;text-align:left}
  .acc-h .cnt{font-size:12px;color:var(--ink2);font-weight:600}
  .acc-h .chev{margin-left:auto;color:var(--ink2);transition:transform .15s}
  .acc.open .acc-h .chev{transform:rotate(180deg)}
  .acc-b{padding:2px 14px 10px;border-top:1px dashed var(--line)}
  /* day navigation */
  .daynav{display:flex;align-items:center;gap:8px;margin:14px 0 0}
  .daynav a,.daynav span.off{border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:12px;padding:9px 14px;font-size:14px;font-weight:600;text-decoration:none;min-height:44px;
    display:inline-flex;align-items:center}
  .daynav span.off{color:var(--ink2);opacity:.5}
  .daynav .back{border:none;background:none;color:var(--accent);padding-left:0}
  /* 3-day per-day mini bars */
  .pdays{display:flex;gap:3px;align-items:flex-end;height:22px;justify-content:flex-end}
  .pdays i{display:block;width:9px;border-radius:2px;background:var(--accent);min-height:2px}
  .pdays-wrap{text-align:right}
  .pdays-wrap span{font-size:10px;color:var(--ink2)}
  @media (max-width:640px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .hero h1{font-size:22px}
    nav.tabs{top:60px}
    .bar-row{grid-template-columns:74px 1fr 62px}
    .cell{min-height:56px;padding:4px}
    .cbadge{font-size:9px}
  }
</style>
</head>
<body>
<div id="app"><p style="padding:24px;font-family:sans-serif">読み込み中…</p></div>

<script src="https://unpkg.com/preact@10.26.9/dist/preact.umd.js"></script>
<script src="https://unpkg.com/preact@10.26.9/hooks/dist/hooks.umd.js"></script>
<script src="https://unpkg.com/htm@3.1/dist/htm.umd.js"></script>
<script src="./data.js"></script>
<script>
(function(){
  "use strict";
  var h = preact.h, render = preact.render;
  var useState = preactHooks.useState, useMemo = preactHooks.useMemo, useEffect = preactHooks.useEffect;
  var html = htm.bind(h);
  var D = window.TREND_DATA || {days:[], latest:"", calendar:{}, by_day:{}, index:{topics3d:[],cats3d:[],words3d:[],words_week:[],words_month:[],three_days:[],week_days:[],month_days:[],week_range:["",""],month_label:""}};
  var WD = ["日","月","火","水","木","金","土"];
  var CLS_LABEL = {"⏳":"⏳ 継続","📈":"📈 上昇中","🔀":"🔀 複数ソース","🌙":"🌙 沈静化"};
  var CLS_ORDER = ["⏳","📈","🔀","🌙"];

  var CAT_COLORS = {
    "社会・政治":"#2563eb", "経済":"#059669", "テクノロジー":"#7c3aed", "エンタメ":"#db2777",
    "スポーツ":"#ea580c", "ライフ・地域":"#0891b2", "国際":"#4f46e5"
  };
  var PALETTE = ["#2563eb","#7c3aed","#db2777","#059669","#ea580c","#0891b2","#b45309","#4f46e5"];
  function stable(s){ var x=0; for(var i=0;i<s.length;i++){ x=(x*31 + s.charCodeAt(i))>>>0; } return x; }
  function fmt(n){ return (n||0).toLocaleString("ja-JP"); }
  function wdLabel(day){ var d = new Date(day + "T00:00:00"); return isNaN(d) ? "" : WD[d.getDay()]; }

  function Spark(props){
    var bins = props.bins || [], mx = Math.max.apply(null, bins.concat([1]));
    var pts = bins.map(function(v,i){ return (i*5+1) + "," + (16 - (v/mx)*13).toFixed(1); }).join(" ");
    return html`<svg width="62" height="18" viewBox="0 0 62 18" aria-hidden="true" style="display:block;margin-top:4px">
      <polyline points=${pts} fill="none" stroke="#2563eb" stroke-width="1.5"/></svg>`;
  }

  function CloudBlock(props){
    var selState = useState(""), sel = selState[0], setSel = selState[1];
    var items = props.items || [];
    if(!items.length) return html`<p class="empty">データなし</p>`;
    var max = items[0].c || 1;
    var wt = props.wt || null, pool = props.pool || [];
    var selItem = null;
    items.forEach(function(it){ if(it.w === sel) selItem = it; });
    var entry = (wt && sel && wt[sel]) ? wt[sel] : null;
    return html`<div>
      <div class="cloud">
        ${items.map(function(it){
          var size = 10 + (it.c / max) * 26;
          var color = PALETTE[stable(it.w) % PALETTE.length];
          var rot = stable(it.w) % 5 === 0 ? "rotate(-4deg)" : "none";
          var clickable = !!(wt && wt[it.w]);
          return html`<span key=${it.w} title=${clickable ? "タップで関連トピックを表示" : it.c + " 回"}
            class=${clickable ? ("clk" + (sel === it.w ? " sel" : "")) : ""}
            onClick=${clickable ? function(){ setSel(sel === it.w ? "" : it.w); } : null}
            style=${{fontSize: size.toFixed(0) + "px", color: color, transform: rot}}>${it.w}</span>`;
        })}
      </div>
      ${entry ? html`<div class="wpanel">
        <div class="wh">
          <b>${sel}</b>
          <span class="meta" style="margin-top:0">この期間に ${fmt(selItem ? selItem.c : 0)} 回 ・ 関連トピック ${entry.n} 件${entry.n > entry.items.length ? "（出現順の上位 " + entry.items.length + " 件）" : ""}</span>
          <button class="wx" aria-label="関連トピックを閉じる" onClick=${function(){ setSel(""); }}>✕</button>
        </div>
        ${entry.items.map(function(pair, i){
          var p = pool[pair[0]];
          if(!p) return null;
          return html`<div class="witem" key=${i}>
            <div class="title">
              ${p.u ? html`<a href=${p.u} target="_blank" rel="noopener">${p.t}</a>` : p.t}
              <span class="catchip" style=${{background: CAT_COLORS[p.cat] || "#666"}}>${p.cat}</span>
            </div>
            <div class="meta">${p.intl ? "🌐 海外" : "🇯🇵 国内"} ・ この期間 ${fmt(pair[1])} 回 ・ 累計 ${fmt(p.ttl)} 回 ・ ${p.fd}${p.ld && p.ld !== p.fd ? " 〜 " + p.ld : ""}</div>
            <div class="srcs">${p.src.map(function(s){ return html`<span class="src" key=${s}>${s}</span>`; })}</div>
          </div>`;
        })}
      </div>` : null}
      ${wt ? html`<p class="meta">単語をタップすると、その単語を含む話題が下に表示されます。</p>` : null}
    </div>`;
  }

  function Bars(props){
    var mState = useState("items"), metric = mState[0], setMetric = mState[1];
    var cats = props.cats || [];
    var max = Math.max.apply(null, cats.map(function(c){ return c[metric]; }).concat([1]));
    return html`<div>
      <div class="seg">
        <button class=${metric==="items"?"on":""} onClick=${function(){setMetric("items");}}>件数</button>
        <button class=${metric==="bytes"?"on":""} onClick=${function(){setMetric("bytes");}}>データ量</button>
        <button class=${metric==="topics"?"on":""} onClick=${function(){setMetric("topics");}}>話題数</button>
      </div>
      <div style="margin-top:8px">
        ${cats.map(function(c){ return html`<div class="bar-row" key=${c.name}>
          <div class="nm">${c.name}</div>
          <div class="bar-track"><div class="bar-fill" style=${{width:(100*c[metric]/max)+"%", background:CAT_COLORS[c.name]}}></div></div>
          <div class="vl">${metric==="bytes" ? (c.bytes/1024).toFixed(0)+" KB" : fmt(c[metric])}</div>
        </div>`; })}
      </div>
      <p class="meta">最大分野のシェアは ${cats.length ? Math.max.apply(null, cats.map(function(c){return c.share||0;})) : 0}%（偏り上限50%の目安と照合できます）</p>
    </div>`;
  }

  function TopicCard(props){
    var t = props.t, color = CAT_COLORS[t.category] || "#666";
    return html`<div class="card" style="margin:8px 0;padding:12px 14px">
      <div class="topic">
        <div class="main">
          <div class="title">
            ${t.is_new ? html`<span class="newb">NEW</span>` : null}
            ${t.url ? html`<a href=${t.url} target="_blank" rel="noopener">${t.title}</a>` : t.title}
            <span class="catchip" style=${{background:color}}>${t.category}${t.region ? " · " + t.region : ""}</span>
          </div>
          <div class="meta">初出 ${t.first || "—"} ・ 累計 ${fmt(t.total)} 回 ・ 最良順位 ${t.best_rank || "—"} 位</div>
          <div class="srcs">${t.sources.map(function(s){ return html`<span class="src" key=${s}>${s}</span>`; })}</div>
        </div>
        <div class="nums">
          <b>${t.day}</b><span>当日の出現</span>
          <${Spark} bins=${t.spark}/>
        </div>
      </div>
    </div>`;
  }

  function TopicsTab(props){
    var dd = props.dd;
    var regionState = useState("dom"), region = regionState[0], setRegion = regionState[1];
    var qState = useState(""), q = qState[0], setQ = qState[1];
    var catState = useState("すべて"), cat = catState[0], setCat = catState[1];
    var sortState = useState("day"), sort = sortState[0], setSort = sortState[1];
    var all = region === "dom" ? dd.topics_dom : dd.topics_intl;
    var cats = useMemo(function(){
      var seen = []; all.forEach(function(t){ if(seen.indexOf(t.category) < 0) seen.push(t.category); });
      return ["すべて"].concat(seen);
    }, [region, dd]);
    var list = useMemo(function(){
      var out = all.filter(function(t){
        return (cat === "すべて" || t.category === cat) &&
               (!q || t.title.toLowerCase().indexOf(q.toLowerCase()) >= 0);
      });
      var key = sort === "day" ? "day" : (sort === "total" ? "total" : null);
      if(key) out = out.slice().sort(function(a,b){ return b[key]-a[key]; });
      else out = out.slice().sort(function(a,b){ return b.sources.length-a.sources.length; });
      return out;
    }, [region, q, cat, sort, dd]);
    return html`<div>
      <div class="toolbar">
        <div class="seg" role="tablist">
          <button class=${region==="dom"?"on":""} onClick=${function(){setRegion("dom");setCat("すべて");}}>🇯🇵 国内</button>
          <button class=${region==="intl"?"on":""} onClick=${function(){setRegion("intl");setCat("すべて");}}>🌐 海外</button>
        </div>
        <label class="search">🔍<input placeholder="話題を検索" value=${q}
          onInput=${function(e){ setQ(e.target.value); }}/></label>
        <select value=${sort} onChange=${function(e){ setSort(e.target.value); }}>
          <option value="day">当日の出現順</option>
          <option value="total">累計の出現順</option>
          <option value="src">ソース数順</option>
        </select>
      </div>
      <div class="chips">
        ${cats.map(function(c){ return html`<button key=${c}
          class=${"fchip" + (cat===c ? " on" : "")}
          style=${cat===c ? {background: CAT_COLORS[c] || "#131722"} : null}
          onClick=${function(){ setCat(c); }}>${c}</button>`; })}
      </div>
      ${list.length ? list.map(function(t,i){ return html`<${TopicCard} key=${t.title + i} t=${t}/>`; })
                    : html`<p class="empty">条件に合う話題がありません</p>`}
    </div>`;
  }

  function FieldsTab(props){
    var dd = props.dd;
    var bands = dd.heatmap.bands || [], cats = dd.heatmap.cats || [];
    return html`<div>
      <div class="card">
        <h2>分野バランス</h2>
        <${Bars} cats=${dd.categories}/>
      </div>
      <div class="card">
        <h2>時間帯 × 分野ヒートマップ</h2>
        <p class="meta" style="margin-top:0">色の濃さはその時間帯の中でのシェア。数字は件数（鮮度低ソースを除く）。</p>
        <div class="tblwrap"><table class="heat">
          <thead><tr><th></th>${cats.map(function(c){ return html`<th key=${c}>${c}</th>`; })}</tr></thead>
          <tbody>
          ${bands.map(function(row, bi){
            var tot = row.reduce(function(a,b){ return a+b; }, 0) || 1;
            return html`<tr key=${bi}><th>${bi*2}–${bi*2+2}時</th>
              ${row.map(function(v, ci){
                var share = v / tot;
                var op = 0.25 + share*1.4; if(op > 1) op = 1;
                var style = v === 0 ? null : {background: CAT_COLORS[cats[ci]], opacity: op};
                return html`<td key=${ci} class=${v===0 ? "dim" : ""} style=${style}>${v || "·"}</td>`;
              })}
            </tr>`;
          })}
          </tbody></table></div>
      </div>
    </div>`;
  }

  function CloudTab(props){
    var dd = props.dd;
    var mState = useState("words"), mode = mState[0], setMode = mState[1];
    var items = mode === "words" ? dd.words : dd.kanji;
    return html`<div class="card">
      <h2>${mode === "words" ? "ワードクラウド" : "漢字クラウド"}</h2>
      <div class="seg">
        <button class=${mode==="words"?"on":""} onClick=${function(){setMode("words");}}>単語</button>
        <button class=${mode==="kanji"?"on":""} onClick=${function(){setMode("kanji");}}>漢字</button>
      </div>
      <${CloudBlock} items=${items}
        wt=${mode === "words" ? dd.word_topics : null} pool=${mode === "words" ? dd.wt_pool : null}/>
      <p class="meta">フォントサイズは出現頻度に比例（現行サイトと同じ線形スケール）。色は単語ごとの固定色です。漢字クラウドは1文字の曖昧さが大きいため、関連トピック表示は単語クラウドのみです。</p>
    </div>`;
  }

  function SummaryTab(props){
    var dd = props.dd;
    var openState = useState(dd.summaries.length - 1), open = openState[0], setOpen = openState[1];
    return html`<div>
      <p class="meta" style="margin:10px 0 0">その日の全Intervalサマリー（2時間ごと）。最新は開いた状態で表示しています。見出しの分類と並びは現行の日次ページと同じです。</p>
      ${dd.summaries.map(function(s, i){
        var isOpen = open === i;
        return html`<div class=${"acc" + (isOpen ? " open" : "")} key=${i}>
          <button class="acc-h" onClick=${function(){ setOpen(isOpen ? -1 : i); }}>
            <span>〜${s.end}</span>
            <span class="cnt">${s.window} ・ ${s.entries.length}件</span>
            <span class="chev">▾</span>
          </button>
          ${isOpen ? html`<div class="acc-b">
            ${CLS_ORDER.map(function(cls){
              var es = s.entries.filter(function(e){ return e.cls === cls; });
              if(!es.length) return null;
              return html`<div key=${cls}>
                <div class="sect" style="margin-top:10px">${CLS_LABEL[cls]}</div>
                ${es.map(function(e, j){ return html`<div class="sumitem" key=${j}>
                  <span class="t">${e.url ? html`<a href=${e.url} target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${e.title}</a>` : e.title}</span>
                  ${e.cat ? html`<span class="catchip" style=${{background: CAT_COLORS[e.cat] || "#666"}}>${e.cat}</span>` : null}
                  ${e.desc ? html`<div class="d">${e.desc}</div>` : null}
                </div>`; })}
              </div>`;
            })}
          </div>` : null}
        </div>`;
      })}
      ${dd.summaries_intl && dd.summaries_intl.length ? html`<div>
        <div class="sect">🌐 海外サマリー（昼・過去24時間）</div>
        ${dd.summaries_intl.map(function(s, i){ return html`<div class="card" key=${i} style="margin-top:4px">
          <p class="meta" style="margin-top:0">${s.window}</p>
          ${s.entries.map(function(e, j){ return html`<div class="sumitem" key=${j}>
            <span class="t">${e.url ? html`<a href=${e.url} target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${e.title}</a>` : e.title}</span>
            ${e.meta ? html`<span class="catchip" style=${{background:"#4f46e5"}}>${e.meta}</span>` : null}
            ${e.orig ? html`<div class="d">原文: ${e.orig}</div>` : null}
          </div>`; })}
        </div>`; })}
      </div>` : null}
    </div>`;
  }

  function Calendar(props){
    var latest = D.latest;
    var init = latest ? [parseInt(latest.slice(0,4),10), parseInt(latest.slice(5,7),10)] : [2026, 11];
    var ymState = useState(init), ym = ymState[0], setYm = ymState[1];
    var y = ym[0], m = ym[1];
    function shift(dm){
      var nm = m + dm, ny = y;
      if(nm < 1){ nm = 12; ny--; } if(nm > 12){ nm = 1; ny++; }
      setYm([ny, nm]);
    }
    var first = new Date(y, m-1, 1), offset = first.getDay();
    var ndays = new Date(y, m, 0).getDate();
    var cells = [];
    for(var i=0;i<offset;i++) cells.push(null);
    for(var dnum=1; dnum<=ndays; dnum++) cells.push(dnum);
    while(cells.length % 7) cells.push(null);
    return html`<div class="card">
      <div class="cal-head">
        <button class="iconbtn" aria-label="前の月" onClick=${function(){ shift(-1); }}>‹</button>
        <b>${y}年${m}月</b>
        <button class="iconbtn" aria-label="次の月" onClick=${function(){ shift(1); }}>›</button>
        <span class="meta" style="margin:0">日付をタップすると日次ページへ</span>
      </div>
      <div class="cal">
        ${WD.map(function(w,i){ return html`<div class="wd" key=${i}>${w}</div>`; })}
        ${cells.map(function(c, i){
          if(c === null) return html`<div class="cell blank" key=${"b"+i}></div>`;
          var ds = y + "-" + String(m).padStart(2,"0") + "-" + String(c).padStart(2,"0");
          var cal = D.calendar[ds];
          var cls = "cell" + (cal ? "" : " nodata") + (ds === latest ? " today" : "");
          if(!cal) return html`<div class=${cls} key=${ds}><div class="dnum">${c}</div></div>`;
          return html`<a class=${cls} key=${ds} href=${"#/day/" + ds}>
            <div class="dnum">${c}</div>
            <span class="cbadge">サマリー <b>${cal.summaries}</b>回</span>
            <span class="cbadge">話題 <b>${fmt(cal.topics)}</b>件</span>
          </a>`;
        })}
      </div>
    </div>`;
  }

  function StatsRow(props){
    var st = props.dd.stats || {};
    return html`<div class="stats">
      <div class="stat"><b>${fmt(st.runs)}</b><span>当日の収集回数（国内）</span></div>
      <div class="stat"><b>${fmt(st.items)}</b><span>当日の収集アイテム（国内）</span></div>
      <div class="stat"><b>${fmt(st.dom_topics_active)}</b><span>当日に動いた話題（国内）</span></div>
      <div class="stat"><b>${fmt(st.intl_topics_active)}</b><span>当日に動いた話題（海外）</span></div>
    </div>`;
  }

  function IndexView(){
    var idx = D.index, latest = D.latest, dd = D.by_day[latest] || {stats:{}};
    var maxPd = Math.max.apply(null, idx.topics3d.map(function(t){ return Math.max.apply(null, t.per_day.concat([1])); }).concat([1]));
    return html`<div>
      <div class="hero">
        <h1>トレンドまとめ</h1>
        <p>毎日のトレンドサマリーとワードクラウドのアーカイブ。国内・海外の公開ソースから15分ごとに収集中です。</p>
        <p class="meta">データ蓄積中（${D.days[0]} 〜 ${latest}）。週次・月次クラウドは蓄積に合わせて育ちます。</p>
        <p style="margin-top:12px"><a class="btn" href=${"#/day/" + latest}>最新日 ${latest}（${wdLabel(latest)}）を見る →</a></p>
      </div>
      <${StatsRow} dd=${dd}/>
      <${Calendar}/>
      <div class="card">
        <h2>3日サマリー（${idx.three_days.join(" 〜 ")}）</h2>
        <p class="meta" style="margin-top:0">直近3日で出現回数の多い話題。右の小さい棒は日ごとの出現です。</p>
        ${idx.topics3d.map(function(t, i){ return html`<div class="sumitem" key=${i}>
          <div class="topic">
            <div class="main">
              <div class="title">
                ${t.is_new ? html`<span class="newb">NEW</span>` : null}
                ${t.url ? html`<a href=${t.url} target="_blank" rel="noopener">${t.title}</a>` : t.title}
                <span class="catchip" style=${{background: CAT_COLORS[t.category] || "#666"}}>${t.category}</span>
              </div>
              <div class="meta">累計 ${fmt(t.total)} 回 ・ ソース ${t.nsrc} ・ 初出 ${t.first_date}</div>
            </div>
            <div class="pdays-wrap">
              <b style="font-size:19px;font-variant-numeric:tabular-nums">${t.count}</b><span> 回/3日</span>
              <div class="pdays">${t.per_day.map(function(v, j){
                return html`<i key=${j} style=${{height: Math.max(2, 22*v/maxPd) + "px"}} title=${idx.three_days[j] + ": " + v + "回"}></i>`;
              })}</div>
            </div>
          </div>
        </div>`; })}
      </div>
      <div class="card">
        <h2>分野バランス（3日）</h2>
        <${Bars} cats=${idx.cats3d}/>
      </div>
      <div class="card">
        <h2>3日ワードクラウド</h2>
        <${CloudBlock} items=${idx.words3d} wt=${idx.word_topics3d} pool=${idx.wt3d_pool}/>
      </div>
      <div class="card">
        <h2>週間ワードクラウド</h2>
        <p class="meta" style="margin-top:0">対象: ${idx.week_range[0]} 〜 ${idx.week_range[1]}（実データ: ${idx.week_days.join(", ")}）</p>
        <${CloudBlock} items=${idx.words_week} wt=${idx.word_topics_week} pool=${idx.wtw_pool}/>
      </div>
      <div class="card">
        <h2>月間ワードクラウド（${idx.month_label}）</h2>
        <p class="meta" style="margin-top:0">実データ: ${idx.month_days.join(", ")}</p>
        <${CloudBlock} items=${idx.words_month} wt=${idx.word_topics_month} pool=${idx.wtm_pool}/>
      </div>
    </div>`;
  }

  function DayView(props){
    var day = props.day, dd = D.by_day[day];
    var tabState = useState("summary"), tab = tabState[0], setTab = tabState[1];
    if(!dd) return html`<p class="empty">この日のデータはありません</p>`;
    var pos = D.days.indexOf(day);
    var prev = pos > 0 ? D.days[pos-1] : null;
    var next = pos < D.days.length - 1 ? D.days[pos+1] : null;
    var tabs = [["summary","📰 サマリー"],["topics","🔥 トピック"],["fields","📊 分野"],["cloud","☁️ クラウド"]];
    return html`<div>
      <div class="daynav">
        <a class="back" href="#/">← カレンダーへ</a>
        <div class="spacer"></div>
        ${prev ? html`<a href=${"#/day/" + prev}>‹ ${prev.slice(5)}</a>` : html`<span class="off">‹</span>`}
        ${next ? html`<a href=${"#/day/" + next}>${next.slice(5)} ›</a>` : html`<span class="off">›</span>`}
      </div>
      <div class="hero" style="padding-top:10px">
        <h1>${day}（${wdLabel(day)}）のトレンド</h1>
        <p>その日の全サマリーと、台帳から集計した話題・分野・クラウドをまとめた日次ページです。</p>
      </div>
      <${StatsRow} dd=${dd}/>
      <nav class="tabs">
        ${tabs.map(function(t){ return html`<button key=${t[0]} class=${"tab" + (tab===t[0] ? " on" : "")}
          onClick=${function(){ setTab(t[0]); }}>${t[1]}</button>`; })}
      </nav>
      <section class="panel" key=${tab}>
        ${tab === "summary" ? html`<${SummaryTab} dd=${dd}/>` :
          tab === "topics" ? html`<${TopicsTab} dd=${dd}/>` :
          tab === "fields" ? html`<${FieldsTab} dd=${dd}/>` : html`<${CloudTab} dd=${dd}/>`}
      </section>
    </div>`;
  }

  function parseRoute(){
    var m = (location.hash || "").match(/^#\/day\/(\d{4}-\d{2}-\d{2})$/);
    if(m && D.by_day[m[1]]) return {view:"day", day:m[1]};
    return {view:"index"};
  }

  function App(){
    var rState = useState(parseRoute()), route = rState[0], setRoute = rState[1];
    var darkState = useState(false), dark = darkState[0], setDark = darkState[1];
    useEffect(function(){
      var saved = null;
      try{ saved = localStorage.getItem("trend-theme"); }catch(e){}
      var prefers = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      setDark(saved ? saved === "dark" : prefers);
      function onHash(){ setRoute(parseRoute()); window.scrollTo(0, 0); }
      window.addEventListener("hashchange", onHash);
      return function(){ window.removeEventListener("hashchange", onHash); };
    }, []);
    useEffect(function(){
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      try{ localStorage.setItem("trend-theme", dark ? "dark" : "light"); }catch(e){}
    }, [dark]);
    return html`<div>
      <header><div class="hbar">
        <div class="logo"><a href="#/">トレンド観測所<span class="dot">.</span></a></div>
        <span class="badge">PREACT 試作</span>
        <div class="spacer"></div>
        <button class="iconbtn" aria-label="テーマ切替" onClick=${function(){ setDark(!dark); }}>${dark ? "☀️" : "🌙"}</button>
      </div></header>
      <div class="wrap">
        ${route.view === "day" ? html`<${DayView} key=${route.day} day=${route.day}/>` : html`<${IndexView}/>`}
        <footer>
          これは作り替え検証用の試作です。本番はこちら：
          <a href="https://yasjpn.github.io/ai-dev-public/trends/" target="_blank" rel="noopener">公開中のトレンドサイト</a><br>
          データ: ${D.generated_from} ／ Preact + htm（ビルドなし・CDN読み込み）／ ハッシュルーティングでトップ⇄日次を切替
        </footer>
      </div>
    </div>`;
  }

  render(html`<${App}/>`, document.getElementById("app"));
})();
</script>
</body>
</html>
